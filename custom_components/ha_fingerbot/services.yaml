press:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ha_fingerbot
    pushDepth:
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          mode: box
    lastTime:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: s
    continueNum:
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 20
          mode: box
    continueTime:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: s

